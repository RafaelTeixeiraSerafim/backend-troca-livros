spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/troca}
    username: ${DB_USER:troca}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  mvc:
    problemdetails:
      enabled: true
app:
  jwt-secret: ${JWT_SECRET}
