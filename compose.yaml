services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: troca
      POSTGRES_USER: ${DB_USER:-troca}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d troca"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
